// ---------- wireframe material factory ----------
function wmat(color, op){
  return new THREE.MeshBasicMaterial({color, wireframe:true, transparent:true,
    opacity: op==null?0.85:op, blending:THREE.AdditiveBlending, depthWrite:false});
}
function wmesh(geo, color, op, x,y,z){
  const m = new THREE.Mesh(geo, wmat(color, op));
  if(x!==undefined) m.position.set(x,y,z);
  return m;
}
function edge(geo, color, op, x,y,z){
  const l = new THREE.LineSegments(new THREE.EdgesGeometry(geo),
    new THREE.LineBasicMaterial({color, transparent:true, opacity:op==null?0.85:op,
      blending:THREE.AdditiveBlending, depthWrite:false}));
  if(x!==undefined) l.position.set(x,y,z);
  l.userData.baseOp = op==null?0.85:op;
  return l;
}

// ---------- audio ----------
let AC=null, padGain=null, padFilter=null, padOsc=[];
const PAD_MULTS = [1, 1.5, 2.02, 3.01];
function audioInit(){
  if(AC) return;
  AC = new (window.AudioContext||window.webkitAudioContext)();
  padFilter = AC.createBiquadFilter(); padFilter.type='lowpass'; padFilter.frequency.value=220; padFilter.Q.value=0.9;
  padGain = AC.createGain(); padGain.gain.value = 0.0;
  padFilter.connect(padGain); padGain.connect(AC.destination);
  const gains = [0.5, 0.28, 0.14, 0.07];
  PAD_MULTS.forEach((m,i)=>{
    const o = AC.createOscillator(); o.type='sine'; o.frequency.value=55*m;
    const g = AC.createGain(); g.gain.value=gains[i];
    o.connect(g); g.connect(padFilter); o.start();
    padOsc.push(o);
  });
  const lfo = AC.createOscillator(); lfo.type='sine'; lfo.frequency.value=0.045;
  const lfoG = AC.createGain(); lfoG.gain.value=70;
  lfo.connect(lfoG); lfoG.connect(padFilter.frequency); lfo.start();
  const len = AC.sampleRate*2;
  const buf = AC.createBuffer(1, len, AC.sampleRate);
  const d = buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*0.4;
  const noise = AC.createBufferSource(); noise.buffer=buf; noise.loop=true;
  const bp = AC.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=900; bp.Q.value=0.4;
  const ng = AC.createGain(); ng.gain.value=0.006;
  noise.connect(bp); bp.connect(ng); ng.connect(AC.destination); noise.start();
  padGain.gain.linearRampToValueAtTime(0.055, AC.currentTime+3);
}
function padRoot(f){
  if(!AC) return;
  padOsc.forEach((o,i)=>o.frequency.linearRampToValueAtTime(f*PAD_MULTS[i], AC.currentTime+2.5));
}
const ROOM_ROOTS = [55, 65.41, 49];  // A1, C2, G1
function tone(freq, dur, type, vol, when){
  if(!AC) return;
  const t = AC.currentTime + (when||0);
  const o = AC.createOscillator(); o.type=type||'sine'; o.frequency.value=freq;
  const g = AC.createGain();
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(vol||0.12, t+0.015);
  g.gain.exponentialRampToValueAtTime(0.0001, t+(dur||0.3));
  o.connect(g); g.connect(AC.destination);
  o.start(t); o.stop(t+(dur||0.3)+0.05);
}
const sndGrab  = ()=>{ tone(520,0.12,'triangle',0.10); tone(780,0.1,'sine',0.05,0.02); };
const sndPlace = ()=>{ tone(660,0.4,'sine',0.14); tone(990,0.5,'sine',0.10,0.06); tone(1320,0.6,'sine',0.06,0.12); };
const sndFail  = ()=>{ tone(196,0.18,'triangle',0.07); };
const sndRoom  = ()=>{ [523,659,784,1046].forEach((f,i)=>tone(f,1.2,'sine',0.10,i*0.09)); };
const sndFinal = ()=>{ [523,659,784,1046,1318,1568].forEach((f,i)=>tone(f,1.6,'sine',0.09,i*0.12)); };

// ---------- comfort vignette (snap turns) ----------
const vcv = document.createElement('canvas'); vcv.width = vcv.height = 512;
const vcx = vcv.getContext('2d');
const vgrad = vcx.createRadialGradient(256,256,140, 256,256,256);
vgrad.addColorStop(0,'rgba(0,0,0,0)');
vgrad.addColorStop(0.72,'rgba(0,0,0,0.92)');
vgrad.addColorStop(1,'rgba(0,0,0,1)');
vcx.fillStyle = vgrad; vcx.fillRect(0,0,512,512);
const vign = new THREE.Mesh(new THREE.PlaneGeometry(2.4,2.4),

vign.position.z = -0.55; vign.renderOrder = 999;
camera.add(vign);
let vignT = 0, snapAnim = null;
function comfortSnap(dirSign){
  snapAnim = {from:rig.rotation.y, to:rig.rotation.y - dirSign*Math.PI/4, t:0};
  vignT = 1;
}

// ---------- floor grid ----------
const grid = new THREE.GridHelper(40, 40, COL.grid, COL.grid);
grid.material.transparent = true; grid.material.opacity = 0.22;
grid.material.blending = THREE.AdditiveBlending; grid.material.depthWrite = false;

// dust motes in the void
const dustGeo = new THREE.BufferGeometry();
{
  const n=420, pos=new Float32Array(n*3);
  for(let i=0;i<n;i++){
    const r=6+Math.random()*14, a=Math.random()*Math.PI*2;
    pos[i*3]=Math.cos(a)*r; pos[i*3+1]=Math.random()*5; pos[i*3+2]=Math.sin(a)*r;
  }
  dustGeo.setAttribute('position', new THREE.BufferAttribute(pos,3));
}
const dust = new THREE.Points(dustGeo, new THREE.PointsMaterial({color:0x2a4a5a, size:0.025, transparent:true, opacity:0.7, blending:THREE.AdditiveBlending, depthWrite:false}));
scene.add(dust);

// faint horizon ring
const ring = edge(new THREE.TorusGeometry(9, 0.006, 6, 96), COL.room, 0.35, 0, 0.01, 0);
ring.rotation.x = Math.PI/2;
scene.add(ring);

// ---------- text sprites ----------
function textSprite(text, color, px){
  px = px||44;
  const pad = 18;
  const cv = document.createElement('canvas');
  const cx = cv.getContext('2d');
  cx.font = '700 '+px+'px ui-monospace, Menlo, monospace';
  const w = Math.ceil(cx.measureText(text).width)+pad*2;
  cv.width = w; cv.height = px+pad*2;
  const c = cv.getContext('2d');
  c.font = '700 '+px+'px ui-monospace, Menlo, monospace';
  c.textBaseline='middle';
  c.fillStyle = color||'#e8e6df';
  c.shadowColor = c.fillStyle; c.shadowBlur = 14;
  c.fillText(text, pad, cv.height/2);
  const tex = new THREE.CanvasTexture(cv);
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({map:tex, transparent:true, depthWrite:false, blending:THREE.AdditiveBlending}));
  const scale = 0.0034;
  sp.scale.set(cv.width*scale, cv.height*scale, 1);
  return sp;
}

// ---------- wireframe hands ----------
function makeHand(color){
  const hand = new THREE.Group();
  const palm = wmesh(new THREE.BoxGeometry(0.075, 0.02, 0.1), color, 0.9, 0, 0, 0);
  hand.add(palm);
  // fingers: 4 boxes + thumb, slightly fanned
  for(let i=0;i<4;i++){
    const f = wmesh(new THREE.BoxGeometry(0.014, 0.014, 0.055), color, 0.9, -0.028+i*0.019, 0.004, -0.075);
    f.rotation.x = -0.12;
    hand.add(f);
  }
  const th = wmesh(new THREE.BoxGeometry(0.014, 0.014, 0.045), color, 0.9, 0.048, 0.0, -0.02);
  th.rotation.y = -0.6;
  hand.add(th);
  hand.userData.mat = palm.material; // shared not; keep per mesh
  hand.traverse(o=>{ if(o.material) o.userData.baseOp = o.material.opacity; });
  return hand;
}
function setHandGlow(hand, k){
  hand.traverse(o=>{
    if(o.material){
      o.material.opacity = o.userData.baseOp * (0.45 + 0.55*k);
      o.material.color.setHex(k>0.6 ? COL.goldHot : COL.gold);
    }
  });
}

// ---------- controllers ----------
const controllers = [];
for(let i=0;i<2;i++){
  const c = renderer.xr.getController(i);
  c.addEventListener('selectstart', ()=>onGrab(c));
  c.addEventListener('selectend',   ()=>onRelease(c));
  const hand = makeHand(COL.gold);
  c.add(hand);
  const light = new THREE.PointLight(COL.gold, 0, 1.6);
  c.add(light);
  c.userData = {hand, light, held:null, near:null};
  rig.add(c);
  controllers.push(c);
}

// ---------- desktop fallback ----------
const keys = {};
addEventListener('keydown', e=>keys[e.code]=true);
addEventListener('keyup',   e=>keys[e.code]=false);
let yaw = 0, pitch = 0, pointerLocked = false;
renderer.domElement.addEventListener('dblclick', ()=>renderer.domElement.requestPointerLock());
document.addEventListener('pointerlockchange', ()=>{ pointerLocked = document.pointerLockElement===renderer.domElement; });
addEventListener('mousemove', e=>{
  if(!pointerLocked) return;
  yaw   -= e.movementX*0.0022;
  pitch -= e.movementY*0.0022;
  pitch = Math.max(-1.2, Math.min(1.2, pitch));
});
let desktopHeld = null;
renderer.domElement.addEventListener('click', ()=>{
  if(renderer.xr.isPresenting) return;
  if(desktopHeld){ releaseDesktop(); } else { grabDesktop(); }
});

// ---------- room builders ----------
// Each room: group of blue wireframe furniture + 5 props with sockets.

// room shells ---------------------------------------------------------------
function roomShellBase(g){
  // back wall with baseboard lines, side hints
  const back = edge(new THREE.PlaneGeometry(4.4, 2.6), COL.room, 0.40, 0, 1.3, -2.1);
  g.add(back);
  const left = edge(new THREE.PlaneGeometry(4.4, 2.6), COL.room2, 0.22, -2.2, 1.3, 0.1);
  left.rotation.y = Math.PI/2; g.add(left);
  const right = edge(new THREE.PlaneGeometry(4.4, 2.6), COL.room2, 0.22, 2.2, 1.3, 0.1);
  right.rotation.y = -Math.PI/2; g.add(right);
}
function buildLivingRoom(g){
  roomShellBase(g);
  // sofa
  g.add(edge(new THREE.BoxGeometry(1.6,0.25,0.6, 6,2,3), COL.room, 0.55, -0.35, 0.35, -1.35));
  g.add(edge(new THREE.BoxGeometry(1.6,0.5,0.16, 6,3,1), COL.room, 0.55, -0.35, 0.70, -1.62));
  g.add(edge(new THREE.BoxGeometry(0.16,0.45,0.6, 1,3,3), COL.room, 0.55, -1.03, 0.42, -1.35));
  g.add(edge(new THREE.BoxGeometry(0.16,0.45,0.6, 1,3,3), COL.room, 0.55,  0.33, 0.42, -1.35));
  // coffee table
  g.add(edge(new THREE.BoxGeometry(0.9,0.04,0.5, 4,1,2), COL.room, 0.5, 0, 0.44, -0.55));
  [[-0.4,-0.2],[0.4,-0.2],[-0.4,0.2],[0.4,0.2]].forEach(p=>{
    g.add(edge(new THREE.BoxGeometry(0.04,0.42,0.04), COL.room, 0.5, p[0], 0.21, -0.55+p[1]));
  });
  // bookshelf
  g.add(edge(new THREE.BoxGeometry(0.8,1.6,0.3, 3,6,1), COL.room, 0.5, -1.5, 0.8, -1.45));
  // window

  g.add(win);
  // floor lamp

  g.add(edge(new THREE.ConeGeometry(0.16,0.22, 10,3, true), COL.room, 0.6, 1.55, 1.48, -1.8));
  // rug
  const rug = edge(new THREE.CircleGeometry(1.0, 28), COL.room2, 0.16, 0, 0.015, -0.7);

}

function buildBedroom(g){

// props ---------------------------------------------------------------------
function makeMug(){ const g=new THREE.Group();
  g.add(wmesh(new THREE.CylinderGeometry(0.05,0.045,0.09, 10,2), COL.gold, 0.9, 0,0.045,0));
  const h=wmesh(new THREE.TorusGeometry(0.035,0.008,6,12,Math.PI), COL.gold, 0.9, 0.055,0.05,0); h.rotation.z=-Math.PI/2; g.add(h); return g; }
function makeBook(){ const g=new THREE.Group();
  g.add(wmesh(new THREE.BoxGeometry(0.16,0.22,0.04, 2,3,1), COL.gold, 0.9, 0,0.11,0)); return g; }
function makeCushion(){ const g=new THREE.Group();
  g.add(wmesh(new THREE.SphereGeometry(0.14, 8,6), COL.gold, 0.9, 0,0.10,0));
  g.children[0].scale.set(1.15,0.55,1.15); return g; }
function makeFrame(){ const g=new THREE.Group();
  g.add(wmesh(new THREE.BoxGeometry(0.26,0.2,0.015, 2,2,1), COL.gold, 0.9, 0,0.1,0));

// ---------- people (wireframe figures) ----------
function makePerson(color){
  const g = new THREE.Group();
  const head  = wmesh(new THREE.SphereGeometry(0.115, 10,8), color, 0.9, 0, 1.56, 0); g.add(head);
  const torso = wmesh(new THREE.CylinderGeometry(0.13,0.17,0.55, 9,4), color, 0.9, 0, 1.21, 0); g.add(torso);
  const mkLimb = (x,y,len,r)=>{
    const pivot = new THREE.Group(); pivot.position.set(x,y,0);
    const seg = wmesh(new THREE.CylinderGeometry(r,r*0.8,len, 6,3), color, 0.9, 0, -len/2, 0);
    pivot.add(seg); g.add(pivot); return pivot;
  };
  const armL = mkLimb(-0.20, 1.46, 0.52, 0.045);
  const armR = mkLimb( 0.20, 1.46, 0.52, 0.045);
  const legL = mkLimb(-0.09, 0.93, 0.90, 0.055);
  const legR = mkLimb( 0.09, 0.93, 0.90, 0.055);
  g.userData = {head, torso, armL, armR, legL, legR};
  return g;
}
function poseSitting(p){
  const u = p.userData;
  u.torso.position.y = 0.83;
  u.head.position.y  = 1.18;
  u.armL.position.y = u.armR.position.y = 1.08;
  u.legL.position.y = u.legR.position.y = 0.52;
  u.legL.rotation.x = u.legR.rotation.x = -Math.PI/2*0.9;
  u.armL.rotation.x = u.armR.rotation.x = -0.5;
}
function spawnTableau(kind, g){
  const figs = [];
  if(kind==='sofa'){
    const him = makePerson(COL.gold); him.position.set(-0.62, -0.05, -1.30); poseSitting(him);
    const her = makePerson(COL.pink); her.position.set(-0.28, -0.05, -1.30); poseSitting(her);
    her.scale.setScalar(0.92);
    g.add(him, her); figs.push(him, her);
    g.userData.animate = (t)=>{
      him.userData.armR.rotation.x = -0.9 + Math.sin(t*1.4)*0.12;
      her.userData.head.rotation.y = Math.sin(t*0.8)*0.25;
      him.userData.head.rotation.y = 0.3 + Math.sin(t*0.8+1)*0.1;
    };
  } else if(kind==='dance'){
    const him = makePerson(COL.gold); him.position.set(-0.35, 0, -0.9); him.rotation.y = 0.5;
    const her = makePerson(COL.pink); her.position.set( 0.35, 0, -0.9); her.rotation.y = -0.5;
    her.scale.setScalar(0.92);
    g.add(him, her); figs.push(him, her);
    g.userData.animate = (t)=>{
      const s = Math.sin(t*2.2);
      him.userData.armL.rotation.z =  0.7 + s*0.35;
      him.userData.armR.rotation.z = -0.7 + s*0.35;
      her.userData.armL.rotation.z =  0.7 - s*0.35;
      her.userData.armR.rotation.z = -0.7 - s*0.35;
      him.position.x = -0.35 + s*0.05;
      her.position.x =  0.35 - s*0.05;
      him.userData.torso.rotation.y = s*0.15;
      her.userData.torso.rotation.y = -s*0.15;
    };
  } else { // read
    const parent = makePerson(COL.gold); parent.position.set(-0.75, -0.05, -1.35); poseSitting(parent);
    const child  = makePerson(COL.pink); child.position.set(-0.10, -0.05, -1.25); poseSitting(child);
    child.scale.setScalar(0.6);
    const book = makeBook(); book.position.set(-0.42, 0.52, -1.15); book.rotation.x = -0.5;
    g.add(parent, child, book); figs.push(parent, child);
    g.userData.animate = (t)=>{
      parent.userData.armR.rotation.x = -0.9;
      parent.userData.armL.rotation.x = -0.8 + Math.sin(t*0.7)*0.06;
      child.userData.head.rotation.x = 0.3 + Math.sin(t*1.1)*0.06;
      parent.userData.head.rotation.x = 0.35;
    };
  }
  // figures fade in
  figs.forEach(f=>{
    f.traverse(o=>{ if(o.material){ o.userData.targetOp = o.material.opacity; o.material.opacity = 0; } });
  });
  g.userData.fadeIn = 0;
  return figs;
}

// ---------- game state ----------
const state = {
  started:false, roomIndex:0, placed:0, t0:0, done:false,
  room:null, grabbables:[], sockets:[], tableauGroup:null, hud:null, hudRoom:null
};

function clearRoom(){
  if(state.room){ scene.remove(state.room); }
  state.grabbables = [];
  state.sockets = [];
  state.tableauGroup = null;
  if(state.hud){ scene.remove(state.hud); state.hud=null; }
  if(state.hudRoom){ scene.remove(state.hudRoom); state.hudRoom=null; }
}

function buildRoom(i){
  clearRoom();
  const def = ROOM_DEFS[i];
  const room = new THREE.Group();
  def.shell(room);
  // props + sockets
  def.props.forEach((p, idx)=>{
    const obj = p.make();
    // scatter: arc in front of player, floating slightly
    const ang = -0.9 + idx*(1.8/(def.props.length-1));
    const r = 1.15 + (idx%2)*0.35;
    obj.position.set(Math.sin(ang)*r, 1.05 + (idx%3)*0.12, -Math.cos(ang)*r - 0.4);
    obj.userData = {id:p.id, label:p.label, placed:false, held:false, spin:Math.random()*6.28, home:obj.position.clone()};
    room.add(obj);
    state.grabbables.push(obj);

    const sock = p.make();
    sock.position.fromArray(p.socket);
    sock.traverse(o=>{ if(o.material){ o.material = wmat(COL.mag, 0.22); o.userData.baseOp = 0.22; } });
    sock.userData = {id:p.id, isSocket:true};
    room.add(sock);
    state.sockets.push(sock);
  });
  // room name + progress HUD, floating near back wall
  const name = textSprite(def.name, '#22d3ee', 40);
  name.position.set(0, 2.35, -1.9);
  room.add(name);
  state.hudRoom = name;
  scene.add(room);
  state.room = room;
  state.placed = 0;
  padRoot(ROOM_ROOTS[i]);
  updateHud();
}

function updateHud(){
  if(state.hud) scene.remove(state.hud);
  const txt = state.done ? 'ALL MEMORIES RESTORED' : ('RESTORED ' + state.placed + ' / 5');
  const hud = textSprite(txt, state.done?'#fbbf24':'#8b93a0', 34);
  hud.position.set(0, 2.05, -1.9);
  scene.add(hud);
  state.hud = hud;
}

// ---------- grab / release ----------
function worldPosOf(o){ const v = new THREE.Vector3(); o.getWorldPosition(v); return v; }

function nearestGrabbable(pos, maxD){
  let best=null, bd=maxD;
  state.grabbables.forEach(o=>{
    if(o.userData.placed || o.userData.held) return;
    const d = worldPosOf(o).distanceTo(pos);
    if(d<bd){ bd=d; best=o; }
  });
  return best;
}
function socketFor(obj){
  return state.sockets.find(s=>s.userData.id===obj.userData.id);
}

function onGrab(c){
  if(state.done) { restart(); return; }
  const near = nearestGrabbable(worldPosOf(c), 0.45);
  if(!near){ sndFail(); return; }
  near.userData.held = true;
  c.userData.held = near;
  c.add(near);
  near.position.set(0, 0, -0.05);
  near.rotation.set(0,0,0);
  sndGrab();
  pulse(c, 0.5, 60);
}
function onRelease(c){
  const held = c.userData.held;
  if(!held) return;
  c.userData.held = null;
  held.userData.held = false;
  state.room.attach(held);
  tryPlace(held, c);
}

function grabDesktop(){
  if(state.done){ restart(); return; }
  const dir = new THREE.Vector3(); camera.getWorldDirection(dir);
  const origin = worldPosOf(camera);
  let best=null, bd=2.6;
  state.grabbables.forEach(o=>{
    if(o.userData.placed || o.userData.held) return;
    const to = worldPosOf(o).sub(origin);
    const d = to.length();
    if(d>bd) return;
    if(to.normalize().dot(dir) > 0.86 && d<bd){ bd=d; best=o; }
  });
  if(!best){ sndFail(); return; }
  best.userData.held = true;
  desktopHeld = best;
  camera.add(best);
  best.position.set(0, -0.05, -0.5);
  best.rotation.set(0,0,0);
  sndGrab();
}
function releaseDesktop(){
  const held = desktopHeld; desktopHeld = null;
  if(!held) return;
  held.userData.held = false;
  state.room.attach(held);
  tryPlace(held, null);
}

function tryPlace(held, c){
  const sock = socketFor(held);
  const d = worldPosOf(held).distanceTo(worldPosOf(sock));
  if(d < 0.5){
    held.position.copy(sock.position);
    held.rotation.set(0,0,0);
    held.userData.placed = true;
    held.traverse(o=>{ if(o.material){ o.material = wmat(COL.goldHot, 1.0); o.userData.baseOp = 1.0; } });
    sock.visible = false;
    burst(worldPosOf(sock));
    state.placed++;
    sndPlace();
    updateHud();
    if(c) pulse(c, 1.0, 120);
    if(state.placed === ROOM_DEFS[state.roomIndex].props.length){
      roomComplete();
    }
  }
}

// placement bursts
const bursts = [];
function burst(pos){
  const r = wmesh(new THREE.TorusGeometry(0.13, 0.007, 6, 48), COL.goldHot, 0.9);
  r.position.copy(pos);
  scene.add(r);
  bursts.push({m:r, t:0});
}
function tickBursts(dt){
  for(let i=bursts.length-1;i>=0;i--){
    const b = bursts[i]; b.t += dt;
    b.m.scale.setScalar(1 + b.t*7);
    b.m.material.opacity = Math.max(0, 0.9*(1 - b.t/0.7));
    b.m.rotation.z += dt*2;
    if(b.t>0.7){ scene.remove(b.m); bursts.splice(i,1); }
  }
}

// haptics
function pulse(c, amp, ms){
  try{
    const src = c.userData.inputSource;
    if(src && src.gamepad && src.gamepad.hapticActuators && src.gamepad.hapticActuators[0]){
      src.gamepad.hapticActuators[0].pulse(amp, ms);
    }
  }catch(e){}
}
renderer.xr.addEventListener('sessionstart', ()=>{
  const session = renderer.xr.getSession();
  session.addEventListener('inputsourceschange', ()=>{
    controllers.forEach(c=>{
      c.userData.inputSource = null;
      for(const src of session.inputSources){
        if(src.handedness==='left' && c===controllers[0]) c.userData.inputSource = src;
        if(src.handedness==='right' && c===controllers[1]) c.userData.inputSource = src;
      }
    });
  });
});

// ---------- room complete / progression ----------
let transitioning = false;
function roomComplete(){
  const def = ROOM_DEFS[state.roomIndex];
  sndRoom();
  const tg = new THREE.Group();
  state.room.add(tg);
  state.tableauGroup = tg;
  spawnTableau(def.tableau, tg);
  // flare the room
  state.room.traverse(o=>{
    if(o.material && !o.isSprite){ o.userData.flare = 1; }
  });
  transitioning = true;
  setTimeout(()=>{
    const fade = document.getElementById('fade');
    fade.style.opacity = 1;
    setTimeout(()=>{
      if(state.roomIndex < ROOM_DEFS.length-1){
        state.roomIndex++;
        buildRoom(state.roomIndex);
        // recentre player
        rig.position.set(0,0,0);
        fade.style.opacity = 0;
        transitioning = false;
      } else {
        finishGame();
        fade.style.opacity = 0;
        transitioning = false;
      }
    }, 1300);
  }, 6000);
}

function finishGame(){
  state.done = true;
  clearRoom();
  // all three tableaus around the player
  const kinds = ['sofa','dance','read'];
  kinds.forEach((k,i)=>{
    const g = new THREE.Group();
    const ang = (i/3)*Math.PI*2 + Math.PI/6;
    g.position.set(Math.sin(ang)*2.6, 0, -Math.cos(ang)*2.6);
    g.rotation.y = Math.atan2(-g.position.x, -g.position.z);
    spawnTableau(k, g);
    scene.add(g);
  });
  const t = Math.round((performance.now()-state.t0)/1000);
  const mm = Math.floor(t/60), ss = (''+(t%60)).padStart(2,'0');
  const hud = textSprite('EVERY ROOM REMEMBERS YOU  -  '+mm+':'+ss, '#fbbf24', 40);
  hud.position.set(0, 2.2, -2.2);
  scene.add(hud); state.hud = hud;
  const sub = textSprite('PULL THE TRIGGER TO WANDER AGAIN', '#8b93a0', 30);
  sub.position.set(0, 1.85, -2.2);
  scene.add(sub);
  sndFinal();
}

function restart(){
  state.done = false;
  // clear finale groups
  scene.children.slice().forEach(o=>{
    if(o.userData && o.userData.animate) scene.remove(o);
  });
  // remove non-room sprites added at finale
  if(state.hud){ scene.remove(state.hud); state.hud=null; }
  scene.traverse(o=>{});
  state.roomIndex = 0;
  state.t0 = performance.now();
  buildRoom(0);
}

document.getElementById('startBtn').addEventListener('click', ()=>{

  document.getElementById('title').classList.add('hidden');
  if(!state.started){
    state.started = true;
    state.t0 = performance.now();

const hint = document.getElementById('hint');
function setHint(h){ hint.textContent = h; hint.style.opacity = h?1:0; }

// ---------- per-frame ----------
const clock = new THREE.Clock();
let snapReady = true;

renderer.setAnimationLoop(()=>{
  const t = clock.getElapsedTime();
  const dt = Math.min(clock.getDelta(), 0.05) || 0.016;

  if(state.started && !state.done){
    // idle motion for grabbables + proximity glow
    controllers.forEach(c=>{ c.userData.near = null; });
    state.grabbables.forEach(o=>{
      if(o.userData.placed || o.userData.held) return;
      o.position.y = o.userData.home.y + Math.sin(t*1.4 + o.userData.spin)*0.03;
      o.rotation.y = o.userData.spin + t*0.4;
      // nearest controller distance
      let k = 0;
      controllers.forEach(c=>{
        const d = worldPosOf(o).distanceTo(worldPosOf(c));
        k = Math.max(k, Math.max(0, 1 - d/0.6));
        if(d<0.45) c.userData.near = o;
      });
      // desktop proximity via camera
      if(!renderer.xr.isPresenting){
        const d = worldPosOf(o).distanceTo(worldPosOf(camera));
        k = Math.max(k, Math.max(0, 1 - d/1.4)*0.7);
      }
      o.traverse(m=>{ if(m.material){ m.material.opacity = m.userData.baseOp==null?0.9:m.userData.baseOp*(0.55+0.45*k)+k*0.4; } });
    });
    // sockets pulse
    state.sockets.forEach(s=>{
      if(!s.visible) return;
      const k = 0.5+0.5*Math.sin(t*2.2 + s.position.x*3);
      s.traverse(m=>{ if(m.material) m.material.opacity = 0.08 + k*0.18; });
    });
    // hand glow + light
    controllers.forEach(c=>{
      const held = !!c.userData.held;
      const near = !!c.userData.near;
      setHandGlow(c.userData.hand, held?1:(near?0.75:0.25));
      c.userData.light.intensity = held?0.8:(near?0.4:0.06);
    });
    tickBursts(dt);
    dust.rotation.y += dt*0.008;
    // tableau fade-in + animate
    if(state.tableauGroup){
      const tg = state.tableauGroup;
      if(tg.userData.fadeIn<1){
        tg.userData.fadeIn = Math.min(1, tg.userData.fadeIn + 0.008);
        tg.traverse(o=>{
          if(o.material && o.userData.targetOp!=null) o.material.opacity = o.userData.targetOp * tg.userData.fadeIn;
        });
      }
      if(tg.userData.animate) tg.userData.animate(t);
    }
    // room flare decay after completion
    if(state.room){
      state.room.traverse(o=>{
        if(o.userData && o.userData.flare && o.material && o.userData.baseOp!=null){
          o.userData.flare = Math.max(0, o.userData.flare - 0.004);
          o.material.opacity = Math.min(1, o.userData.baseOp + o.userData.flare*0.6);
        }
      });
    }
  }

  // finale tableau animation
  if(state.done){
    scene.children.forEach(o=>{
      if(o.userData && o.userData.animate){
        if(o.userData.fadeIn<1){
          o.userData.fadeIn = Math.min(1, o.userData.fadeIn + 0.008);
          o.traverse(m=>{ if(m.material && m.userData.targetOp!=null) m.material.opacity = m.userData.targetOp * o.userData.fadeIn; });
        }
        o.userData.animate(t);
      }
    });
  }

  // locomotion: XR thumbsticks
  if(renderer.xr.isPresenting){
    const session = renderer.xr.getSession();
    if(session){
      let mx=0, mz=0, sx=0;
      for(const src of session.inputSources){
        if(!src.gamepad) continue;
        const ax = src.gamepad.axes;
        const x = ax[2]!==undefined?ax[2]:(ax[0]||0);
        const y = ax[3]!==undefined?ax[3]:(ax[1]||0);
        if(src.handedness==='left'){ mx=x; mz=y; }
        if(src.handedness==='right'){ sx=x; }
      }
      if(Math.abs(mx)>0.12 || Math.abs(mz)>0.12){
        const dir = new THREE.Vector3(); camera.getWorldDirection(dir);
        dir.y = 0; dir.normalize();
        const right = new THREE.Vector3().crossVectors(dir, new THREE.Vector3(0,1,0));
        rig.position.addScaledVector(dir, -mz*dt*1.4);
        rig.position.addScaledVector(right, mx*dt*1.4);
      }
      if(Math.abs(sx)>0.7 && snapReady && !snapAnim){
        comfortSnap(Math.sign(sx));
        snapReady = false;
      } else if(Math.abs(sx)<0.3) snapReady = true;
    }
  } else if(state.started){
    // desktop look + WASD
    camera.rotation.set(pitch, yaw, 0, 'YXZ');
    rig.rotation.y = 0;
    const sp = keys.ShiftLeft?3.0:1.6;
    const f = new THREE.Vector3(-Math.sin(yaw), 0, -Math.cos(yaw));
    const r = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw));
    if(keys.KeyW) rig.position.addScaledVector(f,  sp*dt);
    if(keys.KeyS) rig.position.addScaledVector(f, -sp*dt);
    if(keys.KeyA) rig.position.addScaledVector(r, -sp*dt);
    if(keys.KeyD) rig.position.addScaledVector(r,  sp*dt);
  }

  // comfort vignette + smooth snap
  if(snapAnim){
    snapAnim.t += dt/0.16;
    const k = Math.min(1, snapAnim.t);
    const e2 = k*k*(3-2*k);
    rig.rotation.y = snapAnim.from + (snapAnim.to-snapAnim.from)*e2;
    if(k>=1) snapAnim = null;
  }
  if(vignT>0){
    vignT = Math.max(0, vignT - dt*2.6);
    vign.material.opacity = Math.sin(vignT*Math.PI)*0.92;
  } else if(vign.material.opacity!==0) vign.material.opacity = 0;

  renderer.render(scene, camera);
});
